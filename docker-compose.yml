services:
  mysql:
    image: mysql:8.0
    container_name: oxa-running-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: oxa_running
      MYSQL_USER: oxa_user
      MYSQL_PASSWORD: oxa_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: